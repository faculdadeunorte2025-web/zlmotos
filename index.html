<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZL Motos</title>
<meta name="theme-color" content="#111113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZL Motos">
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22ZL%20Motos%22%2C%22short_name%22%3A%22ZL%20Motos%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23111113%22%2C%22theme_color%22%3A%22%23111113%22%7D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111113'/%3E%3Ctext x='32' y='41' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23fafafa'%3EZL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=7.0.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>
<body>

<!-- LOGIN -->
<section id="tela-login" class="login">
  <form class="login-caixa" id="form-login" autocomplete="on">
    <div class="marca marca-grande">ZL <span>MOTOS</span></div>
    <p class="login-sub">Sistema de gestão</p>
    <label class="campo">
      <span>E-mail</span>
      <input type="email" id="login-email" autocomplete="email" required>
    </label>
    <label class="campo">
      <span>Senha</span>
      <input type="password" id="login-senha" autocomplete="current-password" required>
    </label>
    <p class="login-erro" id="login-erro" hidden></p>
    <button type="submit" class="btn btn-primario btn-bloco" id="login-botao">Entrar</button>
  </form>
</section>

<!-- APLICATIVO -->
<div id="app" class="app" hidden>
  <aside class="menu" id="menu">
    <div class="marca">ZL <span>MOTOS</span></div>
    <nav class="menu-itens" id="menu-itens"></nav>
    <div class="menu-rodape">
      <button class="menu-item" data-acao="buscar" title="Buscar (Ctrl+K)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Buscar</span><kbd>Ctrl K</kbd>
      </button>
      <button class="menu-item" data-acao="sair">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <main class="conteudo">
    <div class="estado-salvar" id="estado-salvar" hidden></div>
    <div id="aviso-topo"></div>
    <div id="tela"></div>
  </main>

  <nav class="barra-celular" id="barra-celular"></nav>
</div>

<div id="modais"></div>
<div id="avisos" class="avisos"></div>

<script src="js/imagens.js?v=7.0.0"></script>
<script type="module" src="js/main.js?v=7.0.0"></script>
</body>
</html>
